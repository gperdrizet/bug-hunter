# Local development overrides — use with: docker compose -f docker-compose.yml -f docker-compose.local.yml up db -d
# Exposes DB port so the locally-running backend can reach it
services:
  db:
    ports:
      - "5433:5432"
  # Don't start backend or frontend containers during local dev
  backend:
    profiles: ["production"]
  frontend:
    profiles: ["production"]
